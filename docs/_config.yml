title: Pickles Shaders
description: >-
  A gallery of Pickles shaders by fragilesilver for MustardOS (Andromeda)
  on low-power handhelds, with before/after comparisons.

url: https://fragilesilver.github.io
baseurl: /pickles-shaders

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: dark
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "View on GitHub":
    - "https://github.com/fragilesilver/pickles-shaders"
aux_links_new_tab: true

footer_content: >-
  Pickles Shaders by fragilesilver. Original shaders MIT licensed;
  ports keep their original licenses — see <a href="/pickles-shaders/credits.html">Credits</a>.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - assets/shots/README.md
